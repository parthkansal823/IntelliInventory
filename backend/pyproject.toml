[project]
name = "intelliinventory"
version = "0.1.0"
description = "AI-native inventory management: forecasting, multi-agent copilot (Hermes / Claude / offline), hooks and MCP"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "openai>=3.19.2",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.47",
    "sse-starlette>=3.4.11",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
