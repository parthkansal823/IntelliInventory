# Your real shop on ONE server - app + Hermes AI (Ollama) + PostgreSQL (+ HTTPS). Free on Oracle Cloud Always Free
# (2 ARM CPUs, 12 GB RAM) or on any Linux box / your own PC with Docker.
#   first time:  bash deploy/server/setup.sh        updates: bash deploy/server/update.sh   (the Deploy workflow runs it)
# Profiles (set COMPOSE_PROFILES in .env):
#   https  -> Caddy with automatic Let's Encrypt HTTPS on $DOMAIN (e.g. 1-2-3-4.sslip.io - free, no domain needed)
#   demo   -> a second, public DEMO copy (sample shop, Parth/Ananya logins) on $DEMO_DOMAIN, sharing the same Hermes AI;
#             its data resets on every restart/deploy
#   tunnel -> Cloudflare quick tunnel: free https://<random>.trycloudflare.com link, no open ports (URL changes on restart)
name: intelliinventory

services:
  app:
    build: { context: ../.., dockerfile: Dockerfile }
    image: intelliinventory-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://intelli:${POSTGRES_PASSWORD}@postgres:5432/intelliinventory
      OLLAMA_URL: http://ollama:11434
      HERMES_MODEL: ${HERMES_MODEL:-hermes3:3b}
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: [app-data:/data]
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }

  demo:
    image: intelliinventory-app
    profiles: [demo]
    restart: unless-stopped
    environment:
      DEMO_MODE: "true"
      DATABASE_URL: sqlite:////data/demo.db
      OLLAMA_URL: http://ollama:11434
      HERMES_MODEL: ${HERMES_MODEL:-hermes3:3b}
      SECRET_KEY: demo-${SECRET_KEY}
      INTEGRATION_TOKEN: demo-${INTEGRATION_TOKEN}
      PUBLIC_URL: https://${DEMO_DOMAIN:-demo.localhost}
    # fresh sample shop on every start
    command: ["sh", "-c", "rm -f /data/demo.db*; alembic upgrade head || true; exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    ports: ["${DEMO_PORT:-8001}:8000"]
    volumes: [demo-data:/data]
    depends_on: [app, ollama]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: intelliinventory
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelli -d intelliinventory"]
      interval: 5s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment: { OLLAMA_KEEP_ALIVE: 24h }
    volumes: [ollama:/root/.ollama]

  # one-shot: downloads the Hermes model the first time (~2 GB for hermes3:3b), then exits
  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "sleep 5 && ollama pull ${HERMES_MODEL:-hermes3:3b}"]
    restart: "no"

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
      DEMO_DOMAIN: "${DEMO_DOMAIN:-demo.localhost}"
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    depends_on: [app]

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on: [app]

volumes:
  app-data:
  demo-data:
  pg:
  ollama:
  caddy:
