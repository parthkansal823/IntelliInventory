name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env: { OLLAMA_AUTODETECT: "false" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t intelliinventory .
      - name: Smoke test the image (demo mode, like the Koyeb demo)
        run: |
          docker run -d --name smoke -p 8000:10000 -e PORT=10000 -e DEMO_MODE=true -e AI_PROVIDER=offline intelliinventory
          for i in $(seq 1 60); do curl -fsS localhost:8000/api/health && break; sleep 2; done
          curl -fsS localhost:8000/api/system/public | grep -q '"demo_mode":true'
          curl -fsS localhost:8000/ | grep -qi '<div id="root"'
          docker logs smoke | tail -20
