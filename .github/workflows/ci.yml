name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env: { OLLAMA_AUTODETECT: "false" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t intelliinventory .
      - name: Lint the Hugging Face Space image
        run: docker build --check deploy/huggingface
      - name: Deploy script dry run
        run: HF_TOKEN=dry HF_USER=ci SHOP_DATABASE_URL=postgres://x SHOP_ADMIN_EMAIL=a@b.in SHOP_ADMIN_PASSWORD=x python3 deploy/huggingface/deploy.py --dry-run
